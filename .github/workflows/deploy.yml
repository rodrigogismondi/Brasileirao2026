name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Detect cache-only sync commit
        id: meta
        run: |
          msg="${{ github.event.head_commit.message }}"
          if echo "$msg" | grep -q "chore: sync live"; then
            echo "skip_sync=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip_sync=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync live cache from GE Globo
        if: steps.meta.outputs.skip_sync != '1'
        run: npm run sync-live

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          SKIP_LIVE_SYNC: ${{ steps.meta.outputs.skip_sync }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

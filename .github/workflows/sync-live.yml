name: Sync live cache

# Fast live tick: updates current-round scores and commits cache to main.
# A push to main then triggers Deploy (which skips re-sync for these commits).
#
# IMPORTANT: GitHub Actions `schedule` is unreliable (often delayed hours).
# Do not rely on this cron alone during live matchdays — keep the Cloud Agent
# `live-cache-sync` timer (~3 min) running for prematch/live windows.
# workflow_dispatch / repository_dispatch remain the reliable manual paths.

on:
  schedule:
    # Requested every 2 minutes — GitHub may coalesce/delay heavily.
    - cron: "*/2 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-live]

permissions:
  contents: write

concurrency:
  group: sync-live-cache
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync live cache from GE / BetExplorer
        run: npm run sync-live

      - name: Commit and push cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cache
          if git diff --staged --quiet; then
            echo "No cache changes"
            exit 0
          fi
          git commit -m "chore: sync live Brasileirão cache"
          git push
